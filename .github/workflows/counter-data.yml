# Refreshes the Counter Picker's matchup data from Stratz every Monday (and on demand from the
# Actions tab, e.g. right after a patch). Needs the repository secret STRATZ_API_TOKEN.
name: Refresh counter data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-counter-data.mjs
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
      - name: Commit if the data changed
        run: |
          git config user.name "6slot-bot"
          git config user.email "6slot-bot@users.noreply.github.com"
          git add public/data/matchups
          git diff --cached --quiet || git commit -m "Refresh counter picker data"
          git push
